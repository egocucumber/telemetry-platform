global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: ingest
    static_configs:
      - targets: ["ingest:9090"]
  - job_name: processor
    dns_sd_configs:
      - names: ["processor"]
        type: A
        port: 9090
  - job_name: alerter
    static_configs:
      - targets: ["alerter:9090"]
  - job_name: query
    static_configs:
      - targets: ["query:9090"]
  - job_name: simulator
    static_configs:
      - targets: ["simulator:9090"]
